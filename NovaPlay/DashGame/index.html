<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NovaGame - Platformer Retro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 10px;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 800 / 450;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 4px solid #38bdf8;
            border-radius: 4px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1e1b4b, #311042);
            display: block;
        }

        .hud {
            position: absolute;
            top: 10px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: clamp(14px, 2.5vw, 18px);
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            z-index: 2;
        }

        .game-over-screen {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.88);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 16px;
            z-index: 5;
        }

        .game-over-screen h1 {
            font-size: clamp(26px, 6vw, 42px);
            color: #ef4444;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px #000;
        }

        .game-over-screen p {
            font-size: clamp(14px, 3vw, 18px);
            margin-bottom: 18px;
        }

        .btn-restart {
            padding: 12px 22px;
            background: #38bdf8;
            border: none;
            color: #0f172a;
            font-size: clamp(14px, 2.8vw, 16px);
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 4px 0 #0284c7;
            touch-action: manipulation;
        }

        .btn-restart:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Controles táctiles para celular/tablet */
        .touch-controls {
            display: none;
            width: 100%;
            max-width: 800px;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            gap: 12px;
        }

        .dpad {
            display: flex;
            gap: 12px;
        }

        .touch-btn {
            background: rgba(56, 189, 248, 0.18);
            border: 2px solid #38bdf8;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            width: 68px;
            height: 62px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .touch-btn.jump-btn {
            width: 110px;
            font-size: 16px;
            background: rgba(74, 222, 128, 0.2);
            border-color: #4ade80;
        }

        .touch-btn:active,
        .touch-btn.active {
            background: rgba(56, 189, 248, 0.55);
            transform: scale(0.96);
        }

        .touch-btn.jump-btn:active,
        .touch-btn.jump-btn.active {
            background: rgba(74, 222, 128, 0.55);
        }

        .controls-hint {
            margin-top: 12px;
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
        }

        /* Mostrar controles táctiles en pantallas pequeñas o dispositivos táctiles */
        @media (pointer: coarse), (max-width: 768px) {
            .touch-controls {
                display: flex;
            }
            .controls-hint {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="hud">
            <span>SCORE: <span id="score-val">0</span></span>
            <span>BEST: <span id="best-val">0</span></span>
        </div>

        <div class="game-over-screen" id="gameOverScreen">
            <h1>¡TE CAÍSTE!</h1>
            <p>Puntuación final: <span id="final-score">0</span></p>
            <button class="btn-restart" onclick="resetGame()">Jugar de Nuevo</button>
        </div>

        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <div class="touch-controls" id="touchControls">
        <div class="dpad">
            <button type="button" class="touch-btn" id="btnLeft" aria-label="Izquierda">◀</button>
            <button type="button" class="touch-btn" id="btnRight" aria-label="Derecha">▶</button>
        </div>
        <button type="button" class="touch-btn jump-btn" id="btnJump" aria-label="Saltar">SALTAR</button>
    </div>

    <div class="controls-hint">
        Controles PC: <b>Flechas / A, D</b> para moverte. <b>Espacio / W / Flecha Arriba</b> para saltar.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('score-val');
        const bestVal = document.getElementById('best-val');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('final-score');

        let gameActive = true;
        let score = 0;
        let bestScore = Number(localStorage.getItem('novaGameBest')) || 0;
        bestVal.textContent = bestScore;
        let frameCount = 0;

        const player = {
            x: 100,
            y: 200,
            width: 24,
            height: 24,
            vx: 0,
            vy: 0,
            speed: 5,
            jumpForce: 12,
            gravity: 0.5,
            isGrounded: false,
            color: '#00f0ff'
        };

        const keys = { left: false, right: false, up: false };
        let platforms = [];
        let gems = [];
        let particles = [];

        function initMap() {
            platforms = [
                { x: 50, y: 350, width: 150, height: 20, color: '#4ade80' },
                { x: 260, y: 300, width: 120, height: 20, color: '#4ade80' },
                { x: 450, y: 240, width: 100, height: 20, color: '#4ade80' },
                { x: 620, y: 320, width: 130, height: 20, color: '#4ade80' },
                { x: 350, y: 150, width: 110, height: 20, color: '#a855f7' }
            ];

            gems = [
                { x: 310, y: 250, baseY: 250, size: 8, collected: false, color: '#eab308' },
                { x: 490, y: 190, baseY: 190, size: 8, collected: false, color: '#eab308' },
                { x: 400, y: 100, baseY: 100, size: 8, collected: false, color: '#ec4899' }
            ];

            particles = [];
        }

        // --- TECLADO (PC) ---
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') keys.up = true;
            if (!gameActive && e.key === 'Enter') resetGame();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') keys.up = false;
        });

        // --- TÁCTIL (CELULAR / TABLET) ---
        function bindTouchButton(btnId, keyName) {
            const btn = document.getElementById(btnId);
            if (!btn) return;

            const press = (e) => {
                e.preventDefault();
                keys[keyName] = true;
                btn.classList.add('active');
            };

            const release = (e) => {
                e.preventDefault();
                keys[keyName] = false;
                btn.classList.remove('active');
            };

            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('touchcancel', release, { passive: false });
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        }

        bindTouchButton('btnLeft', 'left');
        bindTouchButton('btnRight', 'right');
        bindTouchButton('btnJump', 'up');

        function createExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 2,
                    life: 30,
                    color
                });
            }
        }

        function updateScore(points) {
            score += points;
            scoreVal.textContent = score;
            if (score > bestScore) {
                bestScore = score;
                bestVal.textContent = bestScore;
                localStorage.setItem('novaGameBest', bestScore);
            }
        }

        function update() {
            if (!gameActive) return;
            frameCount++;

            if (keys.left) player.vx = -player.speed;
            else if (keys.right) player.vx = player.speed;
            else player.vx = 0;

            player.vy += player.gravity;
            let prevY = player.y;

            player.x += player.vx;
            player.y += player.vy;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            if (player.y > canvas.height) {
                gameActive = false;
                finalScore.textContent = score;
                gameOverScreen.style.display = 'flex';
                return;
            }

            player.isGrounded = false;
            for (let plat of platforms) {
                if (player.x < plat.x + plat.width &&
                    player.x + player.width > plat.x &&
                    player.y < plat.y + plat.height &&
                    player.y + player.height > plat.y) {

                    if (prevY + player.height <= plat.y + 8 && player.vy >= 0) {
                        player.y = plat.y - player.height;
                        player.vy = 0;
                        player.isGrounded = true;
                    }
                }
            }

            if (keys.up && player.isGrounded) {
                player.vy = -player.jumpForce;
                player.isGrounded = false;
            }

            for (let gem of gems) {
                if (!gem.collected) {
                    gem.y = gem.baseY + Math.sin(frameCount * 0.08) * 4;
                    if (player.x < gem.x + gem.size * 2 &&
                        player.x + player.width > gem.x &&
                        player.y < gem.y + gem.size * 2 &&
                        player.y + player.height > gem.y) {

                        gem.collected = true;
                        updateScore(gem.color === '#ec4899' ? 25 : 10);
                        createExplosion(gem.x + gem.size, gem.y + gem.size, gem.color);

                        if (gems.every(g => g.collected)) {
                            respawnGems();
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function respawnGems() {
            for (let gem of gems) {
                gem.collected = false;
                let randomPlat = platforms[Math.floor(Math.random() * platforms.length)];
                gem.x = randomPlat.x + Math.random() * (randomPlat.width - 20);
                gem.baseY = randomPlat.y - 30;
                gem.y = gem.baseY;
            }
            updateScore(50);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 32) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 32) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            for (let plat of platforms) {
                ctx.fillStyle = plat.color;
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(plat.x, plat.y + plat.height - 5, plat.width, 5);
            }

            for (let gem of gems) {
                if (!gem.collected) {
                    ctx.fillStyle = gem.color;
                    ctx.beginPath();
                    ctx.moveTo(gem.x + gem.size, gem.y);
                    ctx.lineTo(gem.x + gem.size * 2, gem.y + gem.size);
                    ctx.lineTo(gem.x + gem.size, gem.y + gem.size * 2);
                    ctx.lineTo(gem.x, gem.y + gem.size);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.fillStyle = '#0f172a';
            if (player.vx >= 0) {
                ctx.fillRect(player.x + 14, player.y + 6, 4, 4);
                ctx.fillRect(player.x + 6, player.y + 6, 4, 4);
            } else {
                ctx.fillRect(player.x + 4, player.y + 6, 4, 4);
                ctx.fillRect(player.x + 12, player.y + 6, 4, 4);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function resetGame() {
            player.x = 100;
            player.y = 200;
            player.vx = 0;
            player.vy = 0;
            score = 0;
            scoreVal.textContent = score;
            initMap();
            gameOverScreen.style.display = 'none';
            gameActive = true;
        }

        initMap();
        loop();
    </script>
</body>
</html>
